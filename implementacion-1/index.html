<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=z, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<body>

    <div class="contenedor">
        <label for="cajaTexto">Escribe algo y presiona Enter:</label>
        <input type="text" id="cajaTexto" placeholder="Ingresa tu texto aquí...">
        
        <button id="btnColores">Cambiar colores</button>
    </div>

    <script>
        const cajaTexto = document.getElementById('cajaTexto');
        
        cajaTexto.addEventListener('keydown', function(evento) {
            if (evento.key === 'Enter') {
                alert(cajaTexto.value);
            }
        });

        const btnColores = document.getElementById('btnColores');
        let estadoColor = 0;
        btnColores.addEventListener('click', function() {
            estadoColor = (estadoColor + 1) % 3;

            switch (estadoColor) {
                case 0:
                    document.body.style.backgroundColor = 'white';
                    document.body.style.color = 'black';
                    break;
                case 1:
                    document.body.style.backgroundColor = 'black';
                    document.body.style.color = 'white';
                    break;
                case 2:
                    document.body.style.backgroundColor = 'lightblue';
                    document.body.style.color = 'red';
                    break;
            }
        });
    </script>

</body>
<script src="index.js"></script>
</html>
